<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUST LEARNING TO STAY SILENT</title>
<style>
  body {
    margin:0; font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #4e0e40, #fecfef);
    height:100vh; display:flex; justify-content:center; align-items:center;
  }
  .card {
    background:white; padding:30px; border-radius:20px;
    width:90%; max-width:400px; text-align:center;
    box-shadow:0 15px 30px rgba(0,0,0,0.2);
  }
  h2{ color:#0b8d2e; }
  input {
    width:90%; padding:12px; margin:10px 0;
    border:2px solid #ff9a9e; border-radius:25px; outline:none; text-align:center;
  }
  button {
    background:#334be3; color:white; border:none;
    padding:12px 25px; border-radius:25px; cursor:pointer;
    font-weight:bold; width:100%; margin-top:10px;
  }
  button:hover{ background:#e8435a; }
  #letterPage{ display:none; }
  .letter {
    background:#fff8f8; border-left:4px solid #ff4e6a;
    padding:20px; text-align:left; border-radius:10px; margin-top:15px;
    animation: fadeIn 1.5s ease;
  }
  @keyframes fadeIn { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
  .heart{ font-size:40px; animation: beat 1s infinite; }
  @keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
  #error{ color:red; font-size:13px; display:none; }
</style>
</head>
<body>

<div class="card" id="loginPage">
  <div class="heart">❤️</div>
  <h2>Only For CLIENT</h2>
  <p>TO SEE MY WORK REGUEST PASS CODE</p>
  <p style="font-size:12px; color:gray;">WHAT MEN LOVE IS PASSWORD <b></b></p>
  <input type="password" id="password" placeholder="Enter Password">
  <p id="error">Wrong code, my CLIENT. Try again</p>
  <button onclick="login()">Open My Work</button>
</div>

<div class="card" id="letterPage">
  <div class="heart">💖</div>
  <h2>PEACE OF MIND</h2>
  <div class="letter">
    <h3>SIMPLE LIFE NEEDS COURAGE</h3>
    <p>Just send some amount of money nothing else!!</p>
    <p>0118889008</p>
    <br>
    <p>Just because you have open it confirmed something my CLIENT!!</p>
  </div>
  <button onclick="alert('I WELCOME YOU ALL TO MY PAGE')">BE ALWAYS HAPPY</button>
</div>

<script>
function login(){
  let pass = document.getElementById("password").value.toLowerCase();
  if(pass === "peace" || pass === "peace" || pass === "WELCOME TO VIEW MY WORK"){
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("letterPage").style.display = "block";
  } else {
    document.getElementById("error").style.display = "block";
  }
}
</script>

</body>
</html>
